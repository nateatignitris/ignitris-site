    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            height: 100vh;
            overflow: hidden;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            animation: pageIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pageIn {
            from { opacity: 0; filter: blur(10px); transform: scale(0.98); }
            to   { opacity: 1; filter: blur(0);    transform: scale(1);    }
        }

        body.page-transitioning {
            animation: pageOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pageOut {
            from { opacity: 1; filter: blur(0);    transform: scale(1);    }
            to   { opacity: 0; filter: blur(10px); transform: scale(1.02); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        .animate-up {
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }
        .delay-4 { animation-delay: 0.65s; }
        .delay-5 { animation-delay: 0.8s; }

        /* NAV */
        nav {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 48px;
            border-radius: 100px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.95);
            transition: opacity 0.2s;
            position: relative;
            z-index: 2;
        }
        .nav-logo:hover { opacity: 0.7; }
        .nav-logo svg {
            height: 18px;
            width: auto;
            display: block;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .btn::before, .btn::after {
            content: ''; position: absolute; width: 6px; height: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3); transition: all 0.3s ease;
        }
        .btn::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .btn::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }
        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        .btn:hover::before, .btn:hover::after { border-color: rgba(255, 255, 255, 0.6); width: 10px; height: 10px; }
        .btn-ghost {
            border-color: transparent;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
        }
        .btn-ghost:hover {
            color: rgba(255, 255, 255, 1);
            background: rgba(255, 255, 255, 0.08);
        }

        /* HERO: full-screen video */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* Full-screen video */
        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .hero-video::-webkit-media-controls { display: none !important; }
        .hero-video::-webkit-media-controls-enclosure { display: none !important; }

        /* Left-side black fade */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(0, 0, 0, 0.92) 0%,
                rgba(0, 0, 0, 0.78) 28%,
                rgba(0, 0, 0, 0.40) 52%,
                rgba(0, 0, 0, 0.00) 72%
            );
        }

        /* Left content: vertically centered */
        .hero-content {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 72px;
            max-width: 460px;
        }

        .hero-content h1 {
            font-size: clamp(36px, 3.4vw, 56px);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.05;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .hero-subtitle {
            font-size: 14px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            max-width: 340px;
            line-height: 1.7;
            letter-spacing: 0.01em;
            margin-bottom: 36px;
        }

        /* WAITLIST FORM */
        .waitlist {
            display: flex;
            flex-direction: column;
            gap: 0;
            max-width: 380px;
        }

        .waitlist-row {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        .waitlist-input {
            flex: 1;
            height: 44px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 300;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 0;
            outline: none;
            font-family: inherit;
            transition: all 0.25s ease;
            -webkit-font-smoothing: antialiased;
        }

        .waitlist-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .waitlist-input:focus {
            background: rgba(255, 255, 255, 0.11);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Button matches site .btn system — white fill, corner brackets */
        .waitlist-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            height: 44px;
            padding: 0 20px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            -webkit-font-smoothing: antialiased;
            border-radius: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .waitlist-btn::before, .waitlist-btn::after {
            content: ''; position: absolute; width: 6px; height: 6px;
            border: 1px solid rgba(255, 255, 255, 0.3); transition: all 0.3s ease;
        }
        .waitlist-btn::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .waitlist-btn::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .waitlist-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .waitlist-btn:hover::before, .waitlist-btn:hover::after {
            border-color: rgba(255, 255, 255, 0.6); width: 10px; height: 10px;
        }

        .waitlist-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .waitlist-success {
            display: none;
            font-size: 13px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.65);
            padding: 14px 0 0;
            letter-spacing: 0.01em;
        }

        .waitlist-success.visible {
            display: block;
        }

        .waitlist-error {
            display: none;
            font-size: 11px;
            font-weight: 400;
            color: rgba(255, 110, 110, 0.9);
            padding: 8px 0 0;
            letter-spacing: 0.01em;
        }

        .waitlist-error.visible {
            display: block;
        }

        /* SOCIALS: bottom-left — sharp square style */
        .hero-socials {
            position: absolute;
            bottom: 44px;
            left: 72px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hero-socials a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.42);
            text-decoration: none;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.03);
        }

        .hero-socials a:hover {
            border-color: rgba(255, 255, 255, 0.5);
            color: rgba(255, 255, 255, 1);
            background: rgba(255, 255, 255, 0.1);
        }

        .hero-socials svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }
    </style>
</head>

    <script>
        // Page transitions
        document.addEventListener('DOMContentLoaded', function() {
            const links = document.querySelectorAll('a[href^="/"]');
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    document.body.classList.add('page-transitioning');
                    setTimeout(() => { window.location.href = href; }, 400);
                });
            });
        });

        // Waitlist form
        // To connect your email list, sign up at formspree.io and replace YOUR_FORM_ID below.
        const FORMSPREE_ID = 'YOUR_FORM_ID';

        const emailInput = document.getElementById('waitlist-email');
        const submitBtn  = document.getElementById('waitlist-submit');
        const successMsg = document.getElementById('waitlist-success');
        const errorMsg   = document.getElementById('waitlist-error');

        submitBtn.addEventListener('click', async function() {
            const email = emailInput.value.trim();

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '...';
            errorMsg.classList.remove('visible');

            try {
                const res = await fetch('https://formspree.io/f/' + FORMSPREE_ID, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (res.ok) {
                    emailInput.style.display = 'none';
                    submitBtn.style.display  = 'none';
                    successMsg.classList.add('visible');
                } else {
                    throw new Error('Submit failed');
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add me';
                errorMsg.classList.add('visible');
            }
        });

        emailInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitBtn.click();
        });
    </script>
