<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply — Ignitris</title>
    <meta name="description" content="Apply to join Ignitris. Submit your application for open roles.">
    <meta property="og:title" content="Apply — Ignitris">
    <meta property="og:description" content="Apply to join Ignitris. Submit your application for open roles.">
    <meta property="og:image" content="https://ignitrisofficial.com/og-image.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://ignitrisofficial.com/og-image.png">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --white: #fafafa;
            --gray: #888;
            --gray-dim: #555;
            --gray-border: #222;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-weight: 400;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--black);
            border-bottom: 1px solid var(--gray-border);
        }

        nav::before,
        nav::after {
            content: '+';
            position: absolute;
            bottom: -0.5em;
            font-size: 0.7rem;
            color: #333;
            font-weight: 400;
        }

        nav::before { left: 24px; }
        nav::after { right: 24px; }

        .logo svg {
            height: 28px;
            width: auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: transparent;
            color: var(--white);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 400;
            border: 1px solid var(--gray-border);
        }

        .back-link:hover {
            border-color: #444;
            background: rgba(255,255,255,0.03);
        }

        /* Content */
        .content {
            max-width: 640px;
            margin: 0 auto;
            padding: 140px 48px 100px;
        }

        /* Role Header */
        .role-header {
            margin-bottom: 56px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.5s ease forwards;
        }

        .role-tag {
            display: inline-block;
            margin-bottom: 20px;
            padding: 6px 14px;
            border: 1px solid var(--gray-border);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            color: var(--gray);
            text-transform: uppercase;
        }

        .role-title {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            margin-bottom: 14px;
        }

        .role-description {
            font-size: 0.85rem;
            color: var(--gray);
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .role-details {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
        }

        .role-detail {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .role-detail-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gray-dim);
        }

        .role-detail-value {
            font-size: 0.8rem;
            color: var(--white);
        }

        .role-requirements {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--gray-border);
        }

        .role-requirements h3 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gray-dim);
            margin-bottom: 14px;
            font-weight: 400;
        }

        .role-requirements ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .role-requirements li {
            font-size: 0.82rem;
            color: var(--gray);
            line-height: 1.5;
            padding-left: 16px;
            position: relative;
        }

        .role-requirements li::before {
            content: '—';
            position: absolute;
            left: 0;
            color: #333;
        }

        /* Divider between header and form */
        .header-divider {
            height: 1px;
            background: var(--gray-border);
            margin-bottom: 48px;
            position: relative;
        }

        .header-divider::before,
        .header-divider::after {
            content: '+';
            position: absolute;
            top: -0.45em;
            font-size: 0.7rem;
            color: #333;
            font-weight: 400;
        }

        .header-divider::before { left: -4px; }
        .header-divider::after { right: -4px; }

        /* Form */
        .apply-form {
            display: flex;
            flex-direction: column;
            gap: 36px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.5s ease 0.15s forwards;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gray-dim);
            padding-bottom: 12px;
            border-bottom: 1px solid var(--gray-border);
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            font-size: 0.78rem;
            color: var(--gray);
            letter-spacing: 0.01em;
        }

        label .required {
            color: var(--gray-dim);
            margin-left: 2px;
        }

        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: 1px solid var(--gray-border);
            color: var(--white);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        input::placeholder,
        textarea::placeholder {
            color: #333;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #444;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
        }

        select {
            cursor: pointer;
            background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23555' stroke-width='1.2'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 36px;
        }

        select option {
            background: #111;
            color: var(--white);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        /* File Upload */
        .file-upload {
            position: relative;
            border: 1px dashed var(--gray-border);
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .file-upload:hover {
            border-color: #444;
            background: rgba(255,255,255,0.015);
        }

        .file-upload.dragover {
            border-color: #555;
            background: rgba(255,255,255,0.03);
        }

        .file-upload.has-file {
            border-style: solid;
            border-color: #333;
        }

        .file-upload input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-icon {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--gray-dim);
        }

        .file-upload-text {
            font-size: 0.78rem;
            color: var(--gray-dim);
            line-height: 1.5;
        }

        .file-upload-text span {
            color: var(--white);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .file-upload-hint {
            font-size: 0.68rem;
            color: #444;
            margin-top: 6px;
            font-family: 'IBM Plex Mono', monospace;
        }

        .file-name {
            font-size: 0.78rem;
            color: var(--white);
            font-family: 'IBM Plex Mono', monospace;
        }

        .file-name .remove {
            color: var(--gray-dim);
            margin-left: 10px;
            cursor: pointer;
            text-decoration: underline;
        }

        .file-name .remove:hover {
            color: var(--white);
        }

        /* Divider */
        .form-divider {
            height: 1px;
            background: var(--gray-border);
            margin: 8px 0;
        }

        /* Submit */
        .submit-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 8px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--white);
            color: var(--black);
            border: none;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .submit-btn:hover {
            opacity: 0.88;
        }

        .submit-btn:active {
            transform: scale(0.995);
        }

        .submit-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .submit-note {
            font-size: 0.68rem;
            color: #444;
            text-align: center;
            line-height: 1.6;
        }

        /* Success State */
        .success-state {
            display: none;
            text-align: center;
            padding: 60px 0;
        }

        .success-state.visible {
            display: block;
            animation: fadeUp 0.5s ease forwards;
        }

        .success-icon {
            width: 48px;
            height: 48px;
            border: 1px solid var(--gray-border);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            font-size: 1.2rem;
        }

        .success-state h2 {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .success-state p {
            font-size: 0.82rem;
            color: var(--gray);
            line-height: 1.6;
        }

        .success-state p strong {
            color: var(--white);
            font-weight: 500;
        }

        .success-state a {
            display: inline-block;
            margin-top: 28px;
            padding: 10px 20px;
            border: 1px solid var(--gray-border);
            color: var(--white);
            text-decoration: none;
            font-size: 0.75rem;
        }

        .success-state a:hover {
            border-color: #444;
        }

        /* 404 / Unknown role */
        .not-found {
            text-align: center;
            padding: 40px 0;
            opacity: 0;
            animation: fadeUp 0.5s ease forwards;
        }

        .not-found h2 {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .not-found p {
            font-size: 0.82rem;
            color: var(--gray);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .not-found a {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid var(--gray-border);
            color: var(--white);
            text-decoration: none;
            font-size: 0.75rem;
        }

        .not-found a:hover {
            border-color: #444;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        footer {
            padding: 18px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.55rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--white);
            background: var(--black);
            border-top: 1px solid var(--gray-border);
            position: relative;
        }

        footer::before,
        footer::after {
            content: '+';
            position: absolute;
            top: -0.5em;
            font-size: 0.7rem;
            color: #333;
            font-weight: 400;
        }

        footer::before { left: 24px; }
        footer::after { right: 24px; }

        footer a {
            color: var(--white);
            text-decoration: none;
            margin-left: 32px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        footer a:hover {
            opacity: 0.6;
        }

        /* Responsive */
        @media (max-width: 600px) {
            nav { padding: 20px 24px; }
            .content { padding: 120px 24px 100px; }
            .role-title { font-size: 1.5rem; }
            .role-details { gap: 20px; }
            .field-row { grid-template-columns: 1fr; }
            footer { padding: 16px 24px; }
        }
    </style>
</head>

    <main class="content" id="mainContent"></main>

    <footer>
        <span>© 2026 Ignitris</span>
        <div>
            <a href="https://linkedin.com/company/ignitris" target="_blank">LinkedIn</a>
            <a href="https://instagram.com/ignitris" target="_blank">Instagram</a>
            <a href="https://x.com/ignitris" target="_blank">X</a>
        </div>
    </footer>

    <script>
        // ── Role Configurations ────────────────────────────────────
        const roles = {
            'ml-intern': {
                tag: 'Engineering',
                title: 'ML Engineering Intern',
                description: 'Help build the algorithms that power real-time conversion optimization. You\'ll work directly with the founding team on behavioral modeling, dynamic pricing, and predictive systems — shipping production ML from day one.',
                details: [
                    { label: 'Type', value: 'Internship' },
                    { label: 'Duration', value: '12 weeks' },
                    { label: 'Location', value: 'Remote' },
                    { label: 'Team', value: 'Engineering' },
                ],
                requirements: [
                    'Familiarity with Python and at least one ML framework (PyTorch, TensorFlow, scikit-learn)',
                    'Coursework or projects in machine learning, statistics, or data science',
                    'Strong problem-solving skills and comfort with ambiguity',
                    'Interest in applied ML — recommendation systems, pricing, or behavioral prediction',
                    'Bonus: experience with real-time systems, A/B testing, or production deployment',
                ],
                prompt: 'What excites you about applied ML, and what\'s a technical project you\'re proud of?'
            },
            'bd-intern': {
                tag: 'Business',
                title: 'Business Development Intern',
                description: 'Help us reach PLG startups and build meaningful partnerships. You\'ll learn growth strategy at an early-stage company — from outbound prospecting to closing partnerships and shaping our go-to-market approach.',
                details: [
                    { label: 'Type', value: 'Internship' },
                    { label: 'Duration', value: '12 weeks' },
                    { label: 'Location', value: 'Remote' },
                    { label: 'Team', value: 'Growth' },
                ],
                requirements: [
                    'Strong written and verbal communication skills',
                    'Interest in SaaS, startups, or the PLG ecosystem',
                    'Self-starter mentality — comfortable with outreach and building from scratch',
                    'Analytical thinking — ability to research markets and identify opportunities',
                    'Bonus: experience with CRM tools, sales processes, or startup environments',
                ],
                prompt: 'Why are you drawn to business development, and what\'s an example of you creating an opportunity from nothing?'
            }
        };

        // ── Init ───────────────────────────────────────────────────
        const params = new URLSearchParams(window.location.search);
        const roleKey = params.get('role');
        const main = document.getElementById('mainContent');

        if (!roleKey || !roles[roleKey]) {
            main.innerHTML = `
                <div class="role-header">
                    <div class="role-tag">Apply</div>
                    <h1 class="role-title">Which role are you applying for?</h1>
                    <p class="role-description">Select a position to continue your application.</p>
                    <div style="display:flex;flex-direction:column;gap:12px;margin-top:32px;">
                        ${Object.entries(roles).map(([key, r]) => `
                            <a href="/apply?role=${key}" style="display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border:1px solid var(--gray-border);text-decoration:none;color:var(--white);transition:border-color 0.2s,background 0.2s;">
                                <div>
                                    <div style="font-size:0.95rem;font-weight:500;margin-bottom:4px;">${r.title}</div>
                                    <div style="font-size:0.7rem;color:var(--gray);font-family:'IBM Plex Mono',monospace;">${r.details.map(d => d.value).join(' · ')}</div>
                                </div>
                                <span style="font-size:1rem;opacity:0.4;">→</span>
                            </a>
                        `).join('')}
                    </div>
                </div>`;
            // Hover effect
            main.querySelectorAll('a[href^="apply"]').forEach(a => {
                a.addEventListener('mouseenter', () => { a.style.borderColor = '#444'; a.style.background = 'rgba(255,255,255,0.03)'; });
                a.addEventListener('mouseleave', () => { a.style.borderColor = ''; a.style.background = ''; });
            });
        } else {
            const role = roles[roleKey];
            document.title = 'Apply — ' + role.title + ' — Ignitris';

            main.innerHTML = `
                <div class="role-header">
                    <div class="role-tag">${role.tag}</div>
                    <h1 class="role-title">${role.title}</h1>
                    <p class="role-description">${role.description}</p>
                    <div class="role-details">
                        ${role.details.map(d => `
                            <div class="role-detail">
                                <span class="role-detail-label">${d.label}</span>
                                <span class="role-detail-value">${d.value}</span>
                            </div>`).join('')}
                    </div>
                    <div class="role-requirements">
                        <h3>What we're looking for</h3>
                        <ul>${role.requirements.map(r => '<li>' + r + '</li>').join('')}</ul>
                    </div>
                </div>

                <div class="header-divider"></div>

                <form class="apply-form" id="applyForm" novalidate>
                    <div class="form-section">
                        <div class="section-label">Personal Information</div>
                        <div class="field-row">
                            <div class="field">
                                <label for="firstName">First name <span class="required">*</span></label>
                                <input type="text" id="firstName" name="firstName" placeholder="Jane" required>
                            </div>
                            <div class="field">
                                <label for="lastName">Last name <span class="required">*</span></label>
                                <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                            </div>
                        </div>
                        <div class="field">
                            <label for="email">Email <span class="required">*</span></label>
                            <input type="email" id="email" name="email" placeholder="jane@example.com" required>
                        </div>
                        <div class="field">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                        </div>
                    </div>

                    <div class="form-divider"></div>

                    <div class="form-section">
                        <div class="section-label">Links</div>
                        <div class="field">
                            <label for="linkedin">LinkedIn <span class="required">*</span></label>
                            <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/..." required>
                        </div>
                        <div class="field">
                            <label for="portfolio">Portfolio / GitHub</label>
                            <input type="url" id="portfolio" name="portfolio" placeholder="https://...">
                        </div>
                    </div>

                    <div class="form-divider"></div>

                    <div class="form-section">
                        <div class="section-label">Resume</div>
                        <div class="field">
                            <label>Upload your resume <span class="required">*</span></label>
                            <div class="file-upload" id="fileUpload">
                                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
                                <div class="file-upload-content">
                                    <div class="file-upload-icon">↑</div>
                                    <div class="file-upload-text">Drag & drop or <span>browse</span></div>
                                    <div class="file-upload-hint">PDF, DOC, DOCX — Max 5MB</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-divider"></div>

                    <div class="form-section">
                        <div class="section-label">About You</div>
                        <div class="field">
                            <label for="message">${role.prompt} <span class="required">*</span></label>
                            <textarea id="message" name="message" placeholder="Take your time with this one..." required></textarea>
                        </div>
                    </div>

                    <div class="submit-area">
                        <button type="submit" class="submit-btn" id="submitBtn">Submit Application</button>
                        <p class="submit-note">By submitting, you agree that we may store and review your information for hiring purposes.</p>
                    </div>
                </form>

                <div class="success-state" id="successState">
                    <div class="success-icon">✓</div>
                    <h2>Application received</h2>
                    <p>Thanks for applying to <strong>${role.title}</strong>. We'll be in touch within a week.</p>
                    <a href="/careers">← Back to Careers</a>
                </div>`;

            // ── File Upload ────────────────────────────────────────
            const fileUpload = document.getElementById('fileUpload');
            const fileInput = document.getElementById('resume');

            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const content = fileUpload.querySelector('.file-upload-content');
                    content.innerHTML = '<div class="file-name">' + file.name + '<span class="remove" id="removeFile">remove</span></div>';
                    fileUpload.classList.add('has-file');
                    document.getElementById('removeFile').addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        clearFile();
                    });
                }
            });

            ['dragenter', 'dragover'].forEach(evt => {
                fileUpload.addEventListener(evt, e => { e.preventDefault(); fileUpload.classList.add('dragover'); });
            });
            ['dragleave', 'drop'].forEach(evt => {
                fileUpload.addEventListener(evt, e => { e.preventDefault(); fileUpload.classList.remove('dragover'); });
            });

            function clearFile() {
                fileInput.value = '';
                fileUpload.classList.remove('has-file');
                fileUpload.querySelector('.file-upload-content').innerHTML = `
                    <div class="file-upload-icon">↑</div>
                    <div class="file-upload-text">Drag & drop or <span>browse</span></div>
                    <div class="file-upload-hint">PDF, DOC, DOCX — Max 5MB</div>`;
            }

            // ── Submission ─────────────────────────────────────────
            const form = document.getElementById('applyForm');
            const submitBtn = document.getElementById('submitBtn');
            const successState = document.getElementById('successState');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const required = form.querySelectorAll('[required]');
                let valid = true;

                required.forEach(field => {
                    if (!field.value || (field.type === 'file' && field.files.length === 0)) {
                        field.style.borderColor = '#661111';
                        valid = false;
                        field.addEventListener('input', () => { field.style.borderColor = ''; }, { once: true });
                    }
                });

                if (!valid) return;

                submitBtn.disabled = true;
                submitBtn.textContent = 'Uploading...';

                // Read resume file as base64
                const fileInput = form.querySelector('#resume');
                let resumeBase64 = null;
                let resumeName = null;

                if (fileInput && fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    resumeName = file.name;
                    resumeBase64 = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = () => reject(new Error('Failed to read file'));
                        reader.readAsDataURL(file);
                    });
                }

                submitBtn.textContent = 'Submitting...';

                const payload = {
                    firstName: form.querySelector('#firstName').value.trim(),
                    lastName: form.querySelector('#lastName').value.trim(),
                    email: form.querySelector('#email').value.trim(),
                    phone: form.querySelector('#phone').value.trim(),
                    linkedin: form.querySelector('#linkedin').value.trim(),
                    portfolio: form.querySelector('#portfolio').value.trim(),
                    message: form.querySelector('#message').value.trim(),
                    role: role.title,
                    resumeBase64,
                    resumeName,
                };

                fetch('/api/apply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                .then(() => {
                    form.style.display = 'none';
                    document.querySelector('.header-divider').style.display = 'none';
                    document.querySelector('.role-header').style.display = 'none';
                    successState.classList.add('visible');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                })
                .catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Application';
                    alert('Something went wrong. Please try again.');
                });
            });
        }
    </script>
