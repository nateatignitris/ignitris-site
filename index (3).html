<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignitris — Algorithmic Conversion Engine</title>
    <meta name="description" content="We analyze your users. You get the price that converts them.">
    
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #0a0a0a;
            --white: #fafafa;
            --gray: #888;
            --gray-dim: #555;
            --border: #222;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
            font-weight: 300;
            background: var(--black);
            color: var(--white);
            height: 100vh;
            overflow: hidden;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        nav::before,
        nav::after {
            content: '+';
            position: absolute;
            bottom: -0.5em;
            font-size: 0.7rem;
            color: #333;
            font-weight: 300;
        }

        nav::before { left: 24px; }
        nav::after { right: 24px; }

        .logo svg {
            height: 24px;
            width: auto;
        }

        /* Outlined button style */
        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: transparent;
            color: var(--white);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 300;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .btn-outline:hover {
            border-color: #444;
            background: rgba(255,255,255,0.03);
        }

        .btn-outline .arrow {
            font-size: 1rem;
        }

        /* Main Layout - Split in half */
        .main {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        /* Left side - Form */
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 64px;
            border-right: 1px solid var(--border);
            position: relative;
        }

        /* Cross marks on vertical divider */
        .left-panel::before,
        .left-panel::after {
            content: '+';
            position: absolute;
            right: -0.35em;
            font-size: 0.7rem;
            color: #333;
            font-weight: 300;
        }

        .left-panel::before { top: 70px; }
        .left-panel::after { bottom: 56px; }

        /* Form */
        .form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 340px;
        }

        .form input {
            padding: 14px 18px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--white);
            font-size: 0.9rem;
            font-weight: 300;
            font-family: inherit;
        }

        .form input::placeholder {
            color: var(--gray-dim);
        }

        .form input:focus {
            outline: none;
            border-color: #444;
        }

        .form button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            background: transparent;
            color: var(--white);
            border: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: 300;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .form button:hover {
            border-color: #444;
            background: rgba(255,255,255,0.03);
        }

        .form button .arrow {
            font-size: 1rem;
        }

        /* Success */
        .success {
            display: none;
            padding: 18px 22px;
            border: 1px solid var(--border);
            max-width: 340px;
        }

        .success.show {
            display: block;
        }

        /* Right side - Canvas */
        .right-panel {
            position: relative;
            overflow: hidden;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 18px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.55rem;
            font-weight: 400;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        footer::before,
        footer::after {
            content: '+';
            position: absolute;
            top: -0.5em;
            font-size: 0.7rem;
            color: #333;
            font-weight: 300;
        }

        footer::before { left: 24px; }
        footer::after { right: 24px; }

        footer a {
            color: var(--white);
            text-decoration: none;
            margin-left: 32px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        footer a:hover {
            opacity: 0.6;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main {
                grid-template-columns: 1fr;
            }
            .right-panel {
                display: none;
            }
            .left-panel {
                border-right: none;
                padding: 120px 48px;
            }
            .left-panel::before,
            .left-panel::after {
                display: none;
            }
        }

        @media (max-width: 600px) {
            nav {
                padding: 20px 24px;
            }
            .left-panel {
                padding: 100px 24px;
            }
            footer {
                padding: 16px 24px;
            }
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouseX = null, mouseY = null;
        let isFixed = false;
        let isPreviewing = false;
        const mouseRadius = 80;
        const particleCount = 300;
        const connectionDistance = 45;
        const particleSize = 3;
        
        // Boundaries (nav and footer)
        let topBound, bottomBound;
        
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr);
            
            // Set bounds within the nav and footer lines
            topBound = 0;
            bottomBound = height;
            
            initParticles();
        }
        
        function getFunnelRadius(y) {
            const top = topBound + 20;
            const bottom = bottomBound - 20;
            const topRadius = width * 0.44;
            const bottomRadius = width * 0.02;
            
            if (y <= top) return topRadius;
            if (y >= bottom) return bottomRadius;
            
            const t = (y - top) / (bottom - top);
            const eased = t * t * (3 - 2 * t);
            return topRadius - (topRadius - bottomRadius) * eased;
        }
        
        function initParticles() {
            particles = [];
            const centerX = width * 0.5;
            const top = topBound + 20;
            const bottom = bottomBound - 20;
            
            for (let i = 0; i < particleCount; i++) {
                const y = top + Math.random() * (bottom - top) * 0.95;
                const radius = getFunnelRadius(y);
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * radius * 0.85;
                
                particles.push({
                    x: centerX + Math.cos(angle) * r,
                    y: y,
                    vy: 0.4 + Math.random() * 0.3,
                    angle: angle,
                    angularSpeed: (Math.random() - 0.5) * 0.012,
                    radiusOffset: r / radius,
                    opacity: 0.8,
                    willConvert: Math.random() < 0.15,
                    greenAmount: 0,
                    redAmount: 0,
                    brokeOut: false,
                    breakDirection: 0,
                    breakY: top + (0.4 + Math.random() * 0.4) * (bottom - top)
                });
            }
        }
        
        function update() {
            const centerX = width * 0.5;
            const top = topBound + 20;
            const bottom = bottomBound - 20;
            
            particles.forEach(p => {
                if (p.brokeOut) {
                    p.redAmount = Math.min(1, p.redAmount + 0.025);
                    p.x += p.breakDirection * 1.5;
                    p.y += p.vy * 0.4;
                    p.opacity *= 0.992;
                    
                    if (p.opacity < 0.02 || p.x < -50 || p.x > width + 50) {
                        p.y = top;
                        p.opacity = 0.8;
                        p.brokeOut = false;
                        p.redAmount = 0;
                        p.willConvert = isFixed ? true : Math.random() < 0.15;
                        p.breakY = top + (0.4 + Math.random() * 0.4) * (bottom - top);
                    }
                    return;
                }
                
                p.y += p.vy;
                p.angle += p.angularSpeed;
                
                const radius = getFunnelRadius(p.y);
                const targetR = radius * p.radiusOffset * 0.85;
                const targetX = centerX + Math.cos(p.angle) * targetR;
                p.x += (targetX - p.x) * 0.1;
                
                // Mouse interaction
                if (mouseX !== null && mouseY !== null) {
                    const dx = p.x - mouseX;
                    const dy = p.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < mouseRadius && dist > 0) {
                        const force = (1 - dist / mouseRadius) * 4;
                        p.x += (dx / dist) * force;
                        p.y += (dy / dist) * force * 0.2;
                    }
                }
                
                // Break out
                if (!p.willConvert && p.y > p.breakY && !isFixed && !isPreviewing) {
                    const distFromCenter = Math.abs(p.x - centerX);
                    if (distFromCenter > radius * 0.6) {
                        p.brokeOut = true;
                        p.breakDirection = p.x > centerX ? 1 : -1;
                    }
                }
                
                // Green for converting
                if (isFixed || isPreviewing) {
                    p.greenAmount = Math.min(1, p.greenAmount + 0.04);
                } else if (p.willConvert && p.y > bottom - 150) {
                    p.greenAmount = Math.min(1, p.greenAmount + 0.02);
                }
                
                // Reset at bottom (within bounds)
                if (p.y > bottom) {
                    p.y = top;
                    p.greenAmount = 0;
                    p.willConvert = isFixed ? true : Math.random() < 0.15;
                }
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw connections first - 50% lower opacity
            ctx.lineWidth = 1;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    
                    if (p1.brokeOut || p2.brokeOut) continue;
                    
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < connectionDistance) {
                        // Lowered opacity by 50%
                        const alpha = (1 - dist / connectionDistance) * 0.2;
                        
                        let r = 255, g = 255, b = 255;
                        const greenAvg = (p1.greenAmount + p2.greenAmount) / 2;
                        if (greenAvg > 0) {
                            r = Math.round(255 - 155 * greenAvg);
                            b = Math.round(255 - 105 * greenAvg);
                        }
                        
                        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            
            // Draw particles as SQUARES
            particles.forEach(p => {
                let r = 255, g = 255, b = 255;
                if (p.redAmount > 0) {
                    g = Math.round(255 - 180 * p.redAmount);
                    b = Math.round(255 - 200 * p.redAmount);
                } else if (p.greenAmount > 0) {
                    r = Math.round(255 - 155 * p.greenAmount);
                    b = Math.round(255 - 105 * p.greenAmount);
                }
                
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${p.opacity})`;
                // Square instead of circle
                ctx.fillRect(p.x - particleSize/2, p.y - particleSize/2, particleSize, particleSize);
            });
        }
        
        function animate() {
            update();
            draw();
            requestAnimationFrame(animate);
        }
        
        // Events
        window.addEventListener('resize', resize);
        
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });
        
        canvas.addEventListener('mouseleave', () => {
            mouseX = null;
            mouseY = null;
        });
        
        // Form
        const form = document.getElementById('form');
        const btn = form.querySelector('button');
        
        btn.addEventListener('mouseenter', () => {
            if (!isFixed) isPreviewing = true;
        });
        
        btn.addEventListener('mouseleave', () => {
            if (!isFixed) isPreviewing = false;
        });
        
        form.addEventListener('submit', async e => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerHTML = 'Joining... <span class="arrow">↗</span>';
            
            try {
                const res = await fetch('/api/waitlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: form.querySelector('input[type="email"]').value,
                        company: form.querySelector('input[type="text"]').value
                    })
                });
                
                if (res.ok) {
                    isFixed = true;
                    isPreviewing = false;
                    form.style.display = 'none';
                    document.getElementById('success').classList.add('show');
                } else {
                    throw new Error();
                }
            } catch {
                btn.disabled = false;
                btn.innerHTML = 'Join Waitlist <span class="arrow">↗</span>';
            }
        });
        
        // Init
        resize();
        animate();
    </script>
</body>
</html>
